services:
  - type: web
    name: outcode-landing
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      # Secrets: set these in the Render dashboard, never in this file.
      - key: ADMIN_KEY
        sync: false
      - key: ASCM_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
