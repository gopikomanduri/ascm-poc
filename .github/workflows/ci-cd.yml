name: ASCM Multi-Agent Engine CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. ASCM Core Test Suite & Mathematical Validation ───────────────────
  test-ascm-core:
    name: Run ASCM Core Tests & Math Proofs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run ASCM 103 Core Engine Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Validate ASCM Mathematical Proofs
        run: |
          python ascm_math_proofs.py

      - name: Validate MR-Bench Multi-Repo Coordination
        run: |
          python mr_bench.py --task-limit 1

  # ── 2. Container Build Validation ────────────────────────────────────────
  docker-build-verification:
    name: Build ASCM Engine Docker Image
    runs-on: ubuntu-latest
    needs: test-ascm-core

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ASCM Platform Docker Image
        run: |
          docker build -t ascm-poc:latest .
