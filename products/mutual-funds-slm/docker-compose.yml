version: '3.8'

services:
  # ── 1. Edge Neural Inference Engine (Ollama) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mf-slm-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── 2. Automatic One-Shot Model Initializer ──────────────────────────────
  model-puller:
    image: curlimages/curl:latest
    container_name: mf-slm-model-puller
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        echo "[+] Checking if phi4-mini:latest is present in Ollama..."
        curl -sf -X POST http://ollama:11434/api/pull -d '{"name": "phi4-mini:latest"}'
        echo "[+] Model readiness verified."
    restart: "no"

  # ── 3. Mutual Funds SLM Web Copilot & REST API ───────────────────────────
  slm-serving:
    build:
      context: ../../
      dockerfile: products/mutual-funds-slm/Dockerfile
    container_name: mf-slm-serving
    ports:
      - "8095:8095"
    environment:
      - SLM_PORT=8095
      - OLLAMA_API_BASE=http://ollama:11434
      - OLLAMA_MODEL=phi4-mini:latest
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-fund-data:/app/data-pipeline/data
      - shared-telemetry-data:/app/slm-serving-engine/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8095/api/funds || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── 4. Automated Daily Calculation & Sync Pipeline (Cron Worker) ────────
  nightly-sync-job:
    build:
      context: ../../
      dockerfile: products/mutual-funds-slm/Dockerfile
    container_name: mf-slm-sync-job
    command: ["python", "data-pipeline/app/daily_sync_pipeline.py", "--interval", "86400"]
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - shared-fund-data:/app/data-pipeline/data
      - shared-telemetry-data:/app/slm-serving-engine/data
    restart: unless-stopped

volumes:
  ollama-models:
    name: mf_slm_ollama_models
  shared-fund-data:
    name: mf_slm_shared_fund_data
  shared-telemetry-data:
    name: mf_slm_shared_telemetry_data
