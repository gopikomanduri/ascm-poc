<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Left: Logo area -->
  <g transform="translate(150, 75) scale(1.5)">
    <!-- Anvil base -->
    <path d="M 50 140 L 45 155 L 155 155 L 150 140 Z" fill="#6b7280" opacity="0.3"/>

    <!-- Anvil body -->
    <rect x="55" y="115" width="90" height="25" rx="3" fill="#374151"/>
    <rect x="55" y="115" width="90" height="25" rx="3" fill="none" stroke="#4b5563" stroke-width="1"/>

    <!-- Hammer head -->
    <rect x="70" y="85" width="20" height="35" rx="2" fill="#1f2937"/>
    <rect x="70" y="85" width="20" height="35" rx="2" fill="none" stroke="#374151" stroke-width="1"/>

    <!-- Hammer handle -->
    <line x1="80" y1="60" x2="80" y2="85" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>

    <!-- Sparks -->
    <path d="M 120 70 Q 125 50 130 60 Q 128 75 120 70 Z" fill="#ef4444" opacity="0.9"/>
    <path d="M 115 75 Q 120 55 125 65 Q 123 80 115 75 Z" fill="#f97316" opacity="0.7"/>
    <path d="M 135 90 Q 145 75 150 90 Q 145 105 135 90 Z" fill="#ea580c" opacity="0.8"/>
    <circle cx="140" cy="110" r="4" fill="#fbbf24" opacity="0.9"/>
    <circle cx="135" cy="115" r="3" fill="#fcd34d" opacity="0.7"/>

    <!-- Code accent -->
    <path d="M 110 95 L 115 100 L 110 105" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Center/Right: Text area -->
  <g transform="translate(500, 100)">
    <!-- Main heading -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="-2">
      FORGE
    </text>

    <!-- Tagline -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="300" fill="#d97706" letter-spacing="2">
      Forge Faster. Build Smarter. Close Deals.
    </text>

    <!-- Subheading -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#9ca3af">
      AI-Powered GTM Automation Platform
    </text>
  </g>
</svg>