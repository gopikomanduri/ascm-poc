name: ASCM Multi-Agent Engine CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-ascm-core:
    name: Run ASCM Core Tests & Math Proofs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run ASCM Core Engine Unit Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v
      - name: Validate ASCM Mathematical Proofs
        run: python tools/ascm_math_proofs.py
      - name: Validate MR-Bench Multi-Repo Coordination
        run: python tools/mr_bench.py --task T01

  security-review:
    name: Security Review (Static + Dependency + Coco Adapter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tooling and project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit pip-audit
      - name: Run ASCM deterministic security gate and optional Coco review
        env:
          PYTHONPATH: .
          ASCM_COCO_AGENT_CMD: ${{ secrets.ASCM_COCO_AGENT_CMD }}
        run: |
          mkdir -p security-artifacts
          python -m orchestrator.security.coco_gate \
            --git-base "origin/${GITHUB_BASE_REF:-main}" \
            --report security-artifacts/ascm-security-report.json
          if [ -n "$ASCM_COCO_AGENT_CMD" ]; then
            echo "Coco agent configured; the security report must record a completed Coco run."
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("security-artifacts/ascm-security-report.json").read_text())
          if report.get("coco", {}).get("status") != "completed":
              raise SystemExit("Coco was configured but did not complete successfully.")
          PY
          else
            echo "::warning::Coco agent is not configured in repository secrets; deterministic checks still ran, but this is not a Coco review."
            echo "Coco agent not configured: deterministic scanner only." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Bandit against changed Python files
        shell: bash
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF:-main}"
          mapfile -t changed_py < <(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' | grep -v '^tests/' || true)
          mkdir -p security-artifacts
          if [ "${#changed_py[@]}" -eq 0 ]; then
            echo '{"results":[],"metrics":{}}' > security-artifacts/bandit.json
            echo "No changed Python files to scan."
          else
            bandit -ll -f json -o security-artifacts/bandit.json "${changed_py[@]}"
          fi
      - name: Audit Python dependency vulnerabilities
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output security-artifacts/pip-audit.json
          status=$?
          set -e
          echo "pip-audit exit status: $status" > security-artifacts/pip-audit-status.txt
          if [ "$status" -ne 0 ]; then
            echo "Dependency vulnerability audit failed; inspect the JSON report."
            exit "$status"
          fi
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascm-security-review
          path: security-artifacts/
          if-no-files-found: warn

  docker-build-verification:
    name: Build ASCM Engine Docker Image
    runs-on: ubuntu-latest
    needs: [test-ascm-core, security-review]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build ASCM Platform Docker Image
        run: docker build -t ascm-poc:latest .
