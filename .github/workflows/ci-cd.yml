name: ASCM Multi-Agent Engine CI/CD

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main, 'feat/**' ]
  workflow_dispatch:

# Avoid duplicate expensive model-assisted security reviews for successive commits
# to the same PR; only the newest run needs to consume CI and provider capacity.
concurrency:
  group: ascm-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ascm-core:
    name: Run ASCM Core Tests & Math Proofs
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run ASCM Core Engine Unit Tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v
      - name: Validate ASCM Mathematical Proofs
        run: python tools/ascm_math_proofs.py
      - name: Validate MR-Bench Multi-Repo Coordination
        run: python tools/mr_bench.py --task T01

  security-review:
    name: Security Review (Static + Dependency + Gemini)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tooling and project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install bandit pip-audit
      - name: Run ASCM deterministic security gate and Gemini review
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          mkdir -p security-artifacts
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="$(git rev-parse HEAD^1)"
          fi
          echo "Security review diff base: ${BASE} (event: ${GITHUB_EVENT_NAME})" >> "$GITHUB_STEP_SUMMARY"
          set +e
          python -m orchestrator.security.security_gate \
            --git-base "$BASE" \
            --report security-artifacts/ascm-security-report.json --require-model-review
          status=$?
          set -e
          echo "$status" > security-artifacts/ascm-security-gate-status.txt
          echo "Gemini-backed security review attempted; final gate requires a successful structured response." >> "$GITHUB_STEP_SUMMARY"
      - name: Run Bandit against changed Python files
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE="origin/${GITHUB_BASE_REF}"
          else
            BASE="$(git rev-parse HEAD^1)"
          fi
          echo "Bandit diff base: ${BASE} (event: ${GITHUB_EVENT_NAME})" >> "$GITHUB_STEP_SUMMARY"
          set +e
          mapfile -t changed_py < <(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' | grep -v '^tests/' || true)
          mkdir -p security-artifacts
          if [ "${#changed_py[@]}" -eq 0 ]; then
            echo '{"results":[],"metrics":{}}' > security-artifacts/bandit.json
            status=0
          else
            bandit -ll --skip B603,B607 -f json -o security-artifacts/bandit.json "${changed_py[@]}"
            status=$?
          fi
          echo "$status" > security-artifacts/bandit-status.txt
          set -e
      - name: Audit Python dependency vulnerabilities
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt --format json --output security-artifacts/pip-audit.json
          status=$?
          echo "$status" > security-artifacts/pip-audit-status.txt
          set -e
      - name: Enforce security release gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          failures = []
          def read_status(path):
              try:
                  return int(Path(path).read_text().strip())
              except (OSError, ValueError):
                  return 999
          report_path = Path("security-artifacts/ascm-security-report.json")
          try:
              report = json.loads(report_path.read_text())
          except (OSError, json.JSONDecodeError):
              report = {}
              failures.append("deterministic security report missing or invalid")
          review = report.get("security_review", {})
          if review.get("status") != "completed":
              failures.append(f"model-assisted review did not complete (status={review.get('status', 'missing')}).")
              issues = review.get("issues", [])
              if isinstance(issues, list):
                  for issue in issues[:3]:
                      failures.append(f"Security review diagnostic: {str(issue)[:1000]}")
              if not issues:
                  failures.append("Check GEMINI_API_KEY validity, model access, and provider quota in the security report artifact.")
          elif review.get("passed") is not True:
              failures.append("Security review reported blocking findings; inspect the security report artifact.")
          high = [f for f in report.get("deterministic_findings", []) if f.get("severity") == "HIGH"]
          if high:
              failures.append(f"{len(high)} high-severity deterministic finding(s)")
          if read_status("security-artifacts/bandit-status.txt") != 0:
              failures.append("Bandit reported findings or failed")
          if read_status("security-artifacts/pip-audit-status.txt") != 0:
              failures.append("pip-audit reported dependency vulnerabilities or failed")
          if failures:
              print("SECURITY RELEASE GATE FAILED:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          print("Security release gates passed, including a completed Gemini review.")
          PY
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascm-security-review
          path: security-artifacts/
          if-no-files-found: warn

  docker-build-verification:
    name: Build ASCM Engine Docker Image
    runs-on: ubuntu-latest
    needs: [test-ascm-core, security-review]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build ASCM Platform Docker Image
        run: docker build -t ascm-poc:latest .
